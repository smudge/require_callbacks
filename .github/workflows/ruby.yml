name: Ruby tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install test dependencies
        run: |
          gem install rspec -v '~> 3.3' --no-document
          gem install simplecov --no-document
      - name: Run specs
        run: ruby -Ilib -S rspec spec
