name: Test

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
      - run: gem install bundler -v 1.17.3
      - run: bundle _1.17.3_ install
      - run: bundle _1.17.3_ exec rake spec
